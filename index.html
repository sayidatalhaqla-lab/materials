<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مواد المواقع</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E6B6B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1B2B2F; --muted:#66777B; --line:#DCE3E2;
  --brand:#0E6B6B; --brand-ink:#FFFFFF; --warn:#F2B705; --warn-ink:#4A3800;
  --bad:#B3261E; --good:#1E7B4B; --track:#E3EAE9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10191B; --surface:#182427; --ink:#E8F0EF; --muted:#8FA3A6; --line:#2A3A3D;
    --brand:#3FB3B3; --brand-ink:#08201F; --warn:#F2B705; --warn-ink:#2A2000;
    --bad:#FF8A80; --good:#6FD39B; --track:#243336;
    color-scheme: dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:96px;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.top{
  position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);
  padding:14px 16px;display:flex;align-items:center;gap:10px;
}
.top h1{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  background:rgba(255,255,255,.16);border:0;border-radius:10px;width:42px;height:42px;
  display:grid;place-items:center;color:inherit;cursor:pointer;font-size:20px;flex:none;
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 0}
.search{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);margin-bottom:12px;
}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{
  flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;
  color:var(--muted);cursor:pointer;font-weight:600;
}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.site{
  display:block;width:100%;text-align:right;background:var(--surface);border:1.5px solid var(--line);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
  border-inline-start:6px solid var(--brand);
}
.site:active{background:var(--track)}
.site h2{margin:0 0 2px;font-size:18px}
.site .meta{color:var(--muted);font-size:14px}
.badge{
  display:inline-block;margin-top:8px;margin-inline-end:6px;padding:2px 10px;border-radius:99px;
  font-size:13px;font-weight:600;background:var(--track);
}
.badge.low{background:var(--warn);color:var(--warn-ink)}
.badge.zero{background:var(--bad);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 20px;border:2px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.fab{
  position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--brand);color:var(--brand-ink);border:0;border-radius:99px;padding:14px 26px;
  font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:4;
}
html[dir=rtl] .fab{transform:translateX(50%)}
.summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
}
.sum{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.sum b{display:block;font-size:22px;line-height:1.2}
.sum span{font-size:13px;color:var(--muted)}
.mat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.mat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.mat-name{font-weight:700;font-size:17px}
.mat-rem{text-align:left;white-space:nowrap}
.mat-rem b{font-size:24px;line-height:1}
.mat-rem small{color:var(--muted);margin-inline-start:4px}
.mat-rem.low b{color:#B07F00}
@media (prefers-color-scheme: dark){.mat-rem.low b{color:var(--warn)}}
.mat-rem.zero b{color:var(--bad)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.low{background:var(--warn)}
.bar i.zero{background:var(--bad)}
.mat-stats{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{
  flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);
  font-weight:700;cursor:pointer;
}
.btn.out{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.in{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn);color:var(--warn-ink);font-weight:600;font-size:14px}
.banner.bad{background:var(--bad);color:#fff}
.banner button{background:rgba(0,0,0,.18);color:inherit;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
/* sheet */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
#sheet{
  background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
}
#sheet h3{margin:0 0 14px;font-size:19px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.field{
  width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);
}
textarea.field{min-height:110px;direction:ltr;text-align:left;font-size:13px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:20px}
.log{border-top:1px solid var(--line);margin-top:12px}
.log-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.log-item .q{font-weight:700;white-space:nowrap}
.log-item .q.in{color:var(--good)}
.log-item .q.out{color:var(--bad)}
.log-item small{display:block;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:6px}
.toast{
  position:fixed;top:70px;inset-inline:0;margin:auto;width:max-content;max-width:90%;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-weight:600;
}
.link{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"><div id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* ---------- التخزين (داخل الهاتف) ---------- */
const KEY = 'materials-tracker-v1';
let state = { sites: [], meta: { changes: 0, lastBackup: 0 } };
let view = { site: null, tab: 'active', q: '' };
let storageOK = true;

function idb(){ return new Promise((res, rej) => {
  const r = indexedDB.open('materials-db', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}); }
async function idbGet(k){ const d = await idb(); return new Promise((res, rej) => {
  const t = d.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); }
async function idbSet(k, v){ const d = await idb(); return new Promise((res, rej) => {
  const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

async function snapshot(force){
  try{
    const snaps = (await idbGet('snaps')) || [];
    if (!force && snaps.length && Date.now() - snaps[0].ts < 60*60*1000) return;
    if (!state.sites.length && !force) return;
    snaps.unshift({ ts: Date.now(), data: JSON.parse(JSON.stringify(state)) });
    await idbSet('snaps', snaps.slice(0, 15));
  }catch(e){}
}
async function load(){
  let loaded = null;
  try{ loaded = await idbGet(KEY); }catch(e){}
  if (!loaded){ try{ const v = localStorage.getItem(KEY); if (v) loaded = JSON.parse(v); }catch(e){} }
  if (loaded && Array.isArray(loaded.sites)) state = loaded;
  if (!state.meta) state.meta = { changes: 0, lastBackup: 0 };
  if (!state.meta.lastBackup) state.meta.lastBackup = Date.now();
  await snapshot(false);
  try{ if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
}
async function save(noCount){
  if (!noCount) state.meta.changes = (state.meta.changes || 0) + 1;
  let ok = false;
  try{ await idbSet(KEY, JSON.parse(JSON.stringify(state))); ok = true; }catch(e){}
  try{ localStorage.setItem(KEY, JSON.stringify(state)); ok = true; }catch(e){}
  if (!ok){ storageOK = false; toast('تحذير: ما انحفظ، خزّن نسخة احتياطية'); }
  snapshot(false);
}

/* ---------- أدوات ---------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const num = n => { const x = Math.round(n*100)/100; return x.toLocaleString('ar-EG-u-nu-latn'); };
const fmtDate = d => { try{ return new Date(d+'T00:00:00').toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return d; } };

function stats(m){
  let inn = 0, out = 0;
  m.moves.forEach(x => x.type==='in' ? inn += x.qty : out += x.qty);
  const rem = inn - out;
  const ratio = inn > 0 ? rem / inn : 0;
  const level = rem <= 0 ? 'zero' : (ratio <= 0.2 ? 'low' : 'ok');
  return { inn, out, rem, ratio, level };
}
const siteById = id => state.sites.find(s => s.id === id);

function toast(t){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t; document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

/* ---------- النوافذ ---------- */
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  const f = document.querySelector('#sheet .field'); if (f) setTimeout(()=>f.focus(), 50);
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function confirmSheet(msg, onYes, yesLabel='تأكيد الحذف'){
  openSheet(`<h3>${esc(msg)}</h3>
    <div class="row"><button class="btn" id="no">إلغاء</button><button class="btn danger" id="yes">${yesLabel}</button></div>`);
  document.getElementById('no').onclick = closeSheet;
  document.getElementById('yes').onclick = () => { closeSheet(); onYes(); };
}

/* ---------- العرض ---------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = view.site ? renderSite() : renderHome();
}

function banner(){
  const m = state.meta || {};
  const n = m.changes || 0;
  const old = Date.now() - (m.lastBackup || Date.now()) > 14*24*3600*1000;
  let h = '';
  if (!storageOK) h += `<div class="banner bad"><span>الهاتف ما عم يحفظ البيانات. خزّن نسخة الآن.</span><button data-act="dl">حفظ نسخة</button></div>`;
  else if (n >= 10 || (n > 0 && old)) h += `<div class="banner"><span>مرّ وقت على آخر نسخة احتياطية</span><button data-act="dl">حفظ نسخة</button></div>`;
  return h;
}
function renderHome(){
  let sites = state.sites.filter(s => (view.tab === 'active') === !s.archived);
  if (view.q.trim()) sites = sites.filter(s => s.name.includes(view.q.trim()));
  sites.sort((a,b) => b.created - a.created);

  const cards = sites.map(s => {
    const st = s.materials.map(stats);
    const low = st.filter(x => x.level === 'low').length;
    const zero = st.filter(x => x.level === 'zero' && x.inn > 0).length;
    return `<button class="site" data-act="open-site" data-id="${s.id}">
      <h2>${esc(s.name)}</h2>
      <div class="meta">${s.note ? esc(s.note) + ' — ' : ''}${s.materials.length} مادة</div>
      ${zero ? `<span class="badge zero">${zero} خلصت</span>` : ''}
      ${low ? `<span class="badge low">${low} قاربت تخلص</span>` : ''}
    </button>`;
  }).join('');

  const empty = state.sites.length === 0
    ? `<div class="empty"><b>ما في مواقع لسا</b>اضغط «موقع جديد» وابدأ بتسجيل المواد.</div>`
    : `<div class="empty"><b>ما في نتائج</b>جرّب بحث ثاني أو بدّل التبويب.</div>`;

  return `
  <div class="top">
    <h1>مواقع العمل</h1>
    <button class="icon-btn" data-act="backup" aria-label="نسخة احتياطية">⇅</button>
  </div>
  <div class="wrap">${banner()}
    <input class="search" placeholder="ابحث عن موقع…" value="${esc(view.q)}" data-act="search" aria-label="بحث">
    <div class="tabs">
      <button class="tab" data-act="tab" data-tab="active" aria-pressed="${view.tab==='active'}">الحالية</button>
      <button class="tab" data-act="tab" data-tab="archived" aria-pressed="${view.tab==='archived'}">المنتهية</button>
    </div>
    ${cards || empty}
  </div>
  <button class="fab" data-act="new-site">+ موقع جديد</button>`;
}

function renderSite(){
  const s = siteById(view.site);
  if (!s){ view.site = null; return renderHome(); }
  const all = s.materials.map(stats);
  const total = s.materials.length;
  const lowCount = all.filter(x => x.level !== 'ok' && x.inn > 0).length;

  const mats = s.materials.map((m, i) => {
    const t = all[i];
    const pct = t.inn > 0 ? Math.max(0, Math.min(100, (t.rem / t.inn) * 100)) : 0;
    return `<div class="mat">
      <div class="mat-head" data-act="log" data-id="${m.id}">
        <div>
          <div class="mat-name">${esc(m.name)}</div>
          <div class="mat-stats" style="gap:12px;justify-content:flex-start">
            <span>وارد ${num(t.inn)}</span><span>مستهلك ${num(t.out)}</span>
          </div>
        </div>
        <div class="mat-rem ${t.level}"><b>${num(t.rem)}</b><small>${esc(m.unit)}</small><div style="font-size:12px;color:var(--muted)">متبقي</div></div>
      </div>
      <div class="bar"><i class="${t.level}" style="width:${pct}%"></i></div>
      <div class="actions">
        <button class="btn in" data-act="move" data-type="in" data-id="${m.id}">+ استلام</button>
        <button class="btn out" data-act="move" data-type="out" data-id="${m.id}">− استهلاك</button>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="top">
    <button class="icon-btn" data-act="home" aria-label="رجوع">→</button>
    <h1>${esc(s.name)}</h1>
    <button class="icon-btn" data-act="site-menu" aria-label="خيارات الموقع">⋮</button>
  </div>
  <div class="wrap">${banner()}
    ${s.note ? `<p style="color:var(--muted);margin:0 0 12px">${esc(s.note)}</p>` : ''}
    <div class="summary">
      <div class="sum"><b>${total}</b><span>مادة</span></div>
      <div class="sum"><b>${lowCount}</b><span>تحتاج انتباه</span></div>
      <div class="sum"><b>${s.archived ? 'منتهي' : 'شغّال'}</b><span>الحالة</span></div>
    </div>
    ${mats || `<div class="empty"><b>ما في مواد بهالموقع</b>أضف أول مادة، مثلاً: حبيبات EPDM أو مادة لاصقة.</div>`}
  </div>
  <button class="fab" data-act="new-material">+ مادة جديدة</button>`;
}

/* ---------- الإجراءات ---------- */
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'search'){
    view.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.querySelector('.search'); el.focus(); el.setSelectionRange(pos,pos);
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.dataset.act === 'search') return;
  const a = t.dataset.act, id = t.dataset.id;
  const actions = {
    'tab': () => { view.tab = t.dataset.tab; render(); },
    'open-site': () => { view.site = id; window.scrollTo(0,0); render(); },
    'home': () => { view.site = null; render(); },
    'new-site': newSite,
    'new-material': newMaterial,
    'move': () => moveSheet(id, t.dataset.type),
    'log': () => logSheet(id),
    'site-menu': siteMenu,
    'backup': backupSheet,
    'dl': shareBackup,
  };
  if (actions[a]) actions[a]();
});

function newSite(){
  openSheet(`<h3>موقع جديد</h3>
    <label>اسم الموقع</label><input class="field" id="f-name" placeholder="مثلاً: ملعب مدرسة النور">
    <label>ملاحظة (اختياري)</label><input class="field" id="f-note" placeholder="العنوان، اسم المقاول…">
    <div class="err" id="err"></div>
    <div class="row"><button class="btn" id="c">إلغاء</button><button class="btn primary" id="ok">حفظ</button></div>`);
  document.getElementById('c').onclick = closeSheet;
  document.getElementById('ok').onclick = async () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name){ document.getElementById('err').textContent = 'اكتب اسم الموقع'; return; }
    if (state.sites.some(s => s.name === name)){ document.getElementById('err').textContent = 'في موقع بنفس الاسم'; return; }
    const s = { id: uid(), name, note: document.getElementById('f-note').value.trim(), archived:false, created: Date.now(), materials: [] };
    state.sites.push(s); await save(); closeSheet(); view.site = s.id; render();
  };
}

function siteMenu(){
  const s = siteById(view.site);
  openSheet(`<h3>${esc(s.name)}</h3>
    <button class="btn" style="width:100%;margin-bottom:10px" id="edit">تعديل الاسم والملاحظة</button>
    <button class="btn" style="width:100%;margin-bottom:10px" id="arch">${s.archived ? 'إرجاع للمواقع الحالية' : 'نقل للمواقع المنتهية'}</button>
    <button class="btn danger" style="width:100%" id="del">حذف الموقع وكل بياناته</button>`);
  document.getElementById('edit').onclick = () => editSite(s);
  document.getElementById('arch').onclick = async () => { s.archived = !s.archived; await save(); closeSheet(); view.site = null; render(); toast('تم'); };
  document.getElementById('del').onclick = () => confirmSheet('حذف الموقع «' + s.name + '» نهائياً؟', async () => {
    state.sites = state.sites.filter(x => x.id !== s.id); await save(); view.site = null; render();
  });
}
function editSite(s){
  openSheet(`<h3>تعديل الموقع</h3>
    <label>الاسم</label><input class="field" id="f-name" value="${esc(s.name)}">
    <label>ملاحظة</label><input class="field" id="f-note" value="${esc(s.note)}">
    <div class="err" id="err"></div>
    <div class="row"><button class="btn" id="c">إلغاء</button><button class="btn primary" id="ok">حفظ</button></div>`);
  document.getElementById('c').onclick = closeSheet;
  document.getElementById('ok').onclick = async () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name){ document.getElementById('err').textContent = 'اكتب اسم الموقع'; return; }
    s.name = name; s.note = document.getElementById('f-note').value.trim();
    await save(); closeSheet(); render();
  };
}

function newMaterial(){
  openSheet(`<h3>مادة جديدة</h3>
    <label>اسم المادة</label><input class="field" id="f-name" placeholder="مثلاً: حبيبات EPDM أخضر">
    <div class="row">
      <div><label>الوحدة</label>
        <input class="field" id="f-unit" list="units" placeholder="كغ، كيس…">
        <datalist id="units"><option value="كغ"><option value="كيس"><option value="لتر"><option value="دلو"><option value="م²"><option value="م"><option value="قطعة"><option value="رول"></datalist>
      </div>
      <div><label>الكمية المستلمة</label><input class="field" id="f-qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
    </div>
    <div class="err" id="err"></div>
    <div class="row"><button class="btn" id="c">إلغاء</button><button class="btn primary" id="ok">حفظ</button></div>`);
  document.getElementById('c').onclick = closeSheet;
  document.getElementById('ok').onclick = async () => {
    const name = document.getElementById('f-name').value.trim();
    const unit = document.getElementById('f-unit').value.trim();
    const qty = parseFloat(document.getElementById('f-qty').value) || 0;
    if (!name){ document.getElementById('err').textContent = 'اكتب اسم المادة'; return; }
    if (!unit){ document.getElementById('err').textContent = 'اكتب الوحدة'; return; }
    const s = siteById(view.site);
    if (s.materials.some(m => m.name === name)){ document.getElementById('err').textContent = 'المادة موجودة بالموقع'; return; }
    const m = { id: uid(), name, unit, moves: [] };
    if (qty > 0) m.moves.push({ id: uid(), type:'in', qty, date: today(), note: 'الكمية الأولية' });
    s.materials.push(m); await save(); closeSheet(); render();
  };
}

function findMat(id){ const s = siteById(view.site); return { s, m: s.materials.find(x => x.id === id) }; }

function moveSheet(id, type){
  const { m } = findMat(id);
  const st = stats(m);
  const title = type === 'in' ? 'استلام' : 'استهلاك';
  openSheet(`<h3>${title}: ${esc(m.name)}</h3>
    ${type==='out' ? `<div style="color:var(--muted);margin-bottom:6px">المتبقي: ${num(st.rem)} ${esc(m.unit)}</div>` : ''}
    <div class="row">
      <div><label>الكمية (${esc(m.unit)})</label><input class="field" id="f-qty" type="number" inputmode="decimal" min="0" step="any"></div>
      <div><label>التاريخ</label><input class="field" id="f-date" type="date" value="${today()}"></div>
    </div>
    <label>ملاحظة (اختياري)</label><input class="field" id="f-note" placeholder="${type==='out' ? 'مثلاً: الطبقة الأولى، المنطقة A' : 'مثلاً: شحنة من المورد'}">
    <div class="err" id="err"></div>
    <div class="row"><button class="btn" id="c">إلغاء</button><button class="btn ${type==='out'?'out':'primary'}" id="ok">حفظ</button></div>`);
  document.getElementById('c').onclick = closeSheet;
  document.getElementById('ok').onclick = async () => {
    const qty = parseFloat(document.getElementById('f-qty').value);
    if (!(qty > 0)){ document.getElementById('err').textContent = 'اكتب كمية أكبر من صفر'; return; }
    if (type === 'out' && qty > st.rem + 1e-9){
      document.getElementById('err').textContent = 'الكمية أكبر من المتبقي. سجّل الاستلام أولاً.'; return;
    }
    m.moves.push({ id: uid(), type, qty, date: document.getElementById('f-date').value || today(), note: document.getElementById('f-note').value.trim() });
    await save(); closeSheet(); render(); toast('تم الحفظ');
  };
}

function logSheet(id){
  const { s, m } = findMat(id);
  const st = stats(m);
  const items = [...m.moves].sort((a,b) => b.date.localeCompare(a.date)).map(x => `
    <div class="log-item">
      <div><span class="q ${x.type}">${x.type==='in'?'+':'−'}${num(x.qty)} ${esc(m.unit)}</span>
        <small>${fmtDate(x.date)}${x.note ? ' — ' + esc(x.note) : ''}</small></div>
      <button class="x" data-mv="${x.id}" aria-label="حذف الحركة">✕</button>
    </div>`).join('');
  openSheet(`<h3>${esc(m.name)}</h3>
    <div class="summary" style="margin-bottom:4px">
      <div class="sum"><b>${num(st.inn)}</b><span>وارد</span></div>
      <div class="sum"><b>${num(st.out)}</b><span>مستهلك</span></div>
      <div class="sum"><b>${num(st.rem)}</b><span>متبقي</span></div>
    </div>
    <div class="log">${items || '<p style="color:var(--muted)">ما في حركات لسا.</p>'}</div>
    <div style="display:flex;justify-content:space-between;margin-top:12px">
      <button class="link" id="ren">تعديل الاسم</button>
      <button class="link" id="dm" style="color:var(--bad)">حذف المادة</button>
    </div>
    <button class="btn" style="width:100%;margin-top:6px" id="c">إغلاق</button>`);
  document.getElementById('c').onclick = closeSheet;
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
    const mv = m.moves.find(x => x.id === b.dataset.mv);
    confirmSheet('حذف هالحركة؟', async () => {
      m.moves = m.moves.filter(x => x.id !== mv.id); await save(); render(); logSheet(id);
    });
  });
  document.getElementById('dm').onclick = () => confirmSheet('حذف المادة «' + m.name + '» مع كل حركاتها؟', async () => {
    s.materials = s.materials.filter(x => x.id !== m.id); await save(); render();
  });
  document.getElementById('ren').onclick = () => {
    openSheet(`<h3>تعديل المادة</h3>
      <label>الاسم</label><input class="field" id="f-name" value="${esc(m.name)}">
      <label>الوحدة</label><input class="field" id="f-unit" value="${esc(m.unit)}">
      <div class="err" id="err"></div>
      <div class="row"><button class="btn" id="c2">إلغاء</button><button class="btn primary" id="ok">حفظ</button></div>`);
    document.getElementById('c2').onclick = () => logSheet(id);
    document.getElementById('ok').onclick = async () => {
      const n = document.getElementById('f-name').value.trim(), u = document.getElementById('f-unit').value.trim();
      if (!n || !u){ document.getElementById('err').textContent = 'الاسم والوحدة مطلوبين'; return; }
      m.name = n; m.unit = u; await save(); closeSheet(); render();
    };
  };
}

async function markBackup(){
  state.meta = { changes: 0, lastBackup: Date.now() };
  await save(true); render();
}
function downloadFile(file){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
async function shareBackup(){
  const file = new File([JSON.stringify(state)], 'materials-backup-' + today() + '.json', { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try{ await navigator.share({ files: [file], title: 'نسخة احتياطية - مواد المواقع' }); await markBackup(); toast('تم'); return; }
    catch(e){ if (e && e.name === 'AbortError') return; }
  }
  downloadFile(file); await markBackup(); toast('تم تنزيل الملف');
}
function restoreData(d, label){
  if (!d || !Array.isArray(d.sites)) { const er = document.getElementById('err'); if (er) er.textContent = 'الملف غير صالح'; return; }
  confirmSheet(label || 'استرجاع هالنسخة سيستبدل البيانات الحالية. متأكد؟', async () => {
    await snapshot(true);
    state = d; if (!state.meta) state.meta = { changes: 0, lastBackup: Date.now() };
    await save(true); view.site = null; render(); toast('تم الاسترجاع');
  }, 'استرجاع');
}
async function backupSheet(){
  openSheet(`<h3>الحفظ والنسخ الاحتياطي</h3>
    <p id="st" style="margin:0 0 12px;color:var(--muted)">…</p>
    <button class="btn primary" style="width:100%;margin-bottom:10px" id="sh">حفظ نسخة احتياطية (مشاركة)</button>
    <button class="btn" style="width:100%;margin-bottom:10px" id="sn">النسخ التلقائية داخل التطبيق</button>
    <label>استرجاع من ملف</label>
    <input class="field" type="file" id="rf" accept=".json,application/json">
    <div class="err" id="err"></div>
    <button class="btn" style="width:100%;margin-top:6px" id="c">إغلاق</button>`);
  document.getElementById('c').onclick = closeSheet;
  document.getElementById('sh').onclick = shareBackup;
  document.getElementById('sn').onclick = snapshotsSheet;
  document.getElementById('rf').onchange = ev => { const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { try{ restoreData(JSON.parse(r.result)); }catch(e){ document.getElementById('err').textContent = 'الملف غير صالح'; } }; r.readAsText(f); };
  let p = false; try{ p = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false; }catch(e){}
  const el = document.getElementById('st');
  if (el) el.textContent = p ? 'التخزين على هالهاتف محمي من المسح التلقائي.' : 'ثبّت التطبيق على الشاشة الرئيسية لحماية أفضل من المسح.';
}
async function snapshotsSheet(){
  const snaps = (await idbGet('snaps').catch(() => null)) || [];
  const rows = snaps.map((x, i) => {
    const d = new Date(x.ts);
    const label = d.toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('ar-EG-u-nu-latn', { hour: '2-digit', minute: '2-digit' });
    const mats = x.data.sites.reduce((a, s) => a + s.materials.length, 0);
    return `<div class="log-item"><div><b>${label}</b><small>${x.data.sites.length} موقع، ${mats} مادة</small></div><button class="btn" style="flex:none;padding:8px 14px" data-snap="${i}">استرجاع</button></div>`;
  }).join('');
  openSheet(`<h3>النسخ التلقائية</h3>
    <p style="margin:0 0 6px;color:var(--muted)">التطبيق بياخد نسخة كل ساعة تقريباً. بتفيدك إذا حذفت شي بالغلط.</p>
    <div class="log">${rows || '<p style="color:var(--muted)">ما في نسخ لسا.</p>'}</div>
    <button class="btn" style="width:100%;margin-top:12px" id="c">رجوع</button>`);
  document.getElementById('c').onclick = backupSheet;
  document.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => restoreData(JSON.parse(JSON.stringify(snaps[+b.dataset.snap].data)), 'استرجاع هالنسخة؟ بياناتك الحالية بتنحفظ كنسخة تلقائية.'));
}

load().then(render);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
